<!doctype html>
<meta charset="utf-8">
<title>CADCraft embed harness: wrong origin</title>
<p>The inner page is sandboxed without <code>allow-same-origin</code>, so its origin is opaque. It frames the viewer with
<code>?embed=1</code> and posts <code>cadcraft.zoomExtents</code> every second. The viewer must show the normal app
(no bridge) and must not react or reply.</p>
<iframe sandbox="allow-scripts" style="width:100%;height:80vh;border:1px solid #ccc" srcdoc='
  <body style="margin:0">
  <iframe id="viewer" style="width:100%;height:70vh;border:0"></iframe>
  <pre id="log">replies: none</pre>
  <script>
    const viewer = document.getElementById("viewer");
    viewer.src = new URL("../index.html?embed=1", document.referrer || parent.location.href.replace(/[^/]*$/, "")).href;
    addEventListener("message", e => { document.getElementById("log").textContent = "REPLY RECEIVED: " + JSON.stringify(e.data); });
    setInterval(() => viewer.contentWindow.postMessage({type: "cadcraft.zoomExtents"}, "*"), 1000);
  </script>'></iframe>
